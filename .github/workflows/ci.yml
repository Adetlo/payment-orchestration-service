name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build, test and verify
        # Testcontainers starts postgres, kafka and redis on the runner's Docker daemon.
        run: mvn -B -ntp verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Unit tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Typecheck e2e project
        working-directory: e2e
        run: |
          npm ci
          npx tsc --noEmit -p .

  docker:
    name: Docker images (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: false
          load: false
          tags: payment-orchestration-service/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  compose-smoke:
    name: Compose smoke test (demo.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [docker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the API
        run: scripts/wait-for-health.sh http://localhost:8080 180

      - name: Run the scripted demo
        run: scripts/demo.sh --no-start

      - name: Run the deterministic seed
        run: scripts/seed-demo.sh

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  trivy:
    name: Trivy (vulnerabilities and config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Vulnerability scan (filesystem)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-dirs: node_modules,target,dist

      - name: Misconfiguration scan (Dockerfiles, compose, workflows)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
          skip-dirs: node_modules,target,dist

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lint scripts
        run: |
          shellcheck --version
          shellcheck -x scripts/*.sh
          bash -n scripts/*.sh
